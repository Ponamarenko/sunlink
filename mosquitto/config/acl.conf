# ACL configuration for SunLink

# User permissions
user sunlink_user

# Read permissions
topic read deye/telemetry/+
topic read deye/status/+
topic read deye/response/+
topic read deye/aggregate/+

# Write permissions
topic write deye/control/+
topic write deye/response/+

# System topics
topic read $SYS/#
topic read $SYS/broker/uptime
topic read $SYS/broker/load/#