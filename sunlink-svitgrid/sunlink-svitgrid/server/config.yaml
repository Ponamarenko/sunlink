# SunLink Backend — безопасная конфигурация источника данных (этап 16)
#
# ВАЖНО: это шаблон для изолированной разработки, НЕ production .env.
# По умолчанию используется demo — без сети и без обращения к оборудованию.
# Физический Modbus требует явного SUNLINK_ENABLE_MODBUS=1 и отдельного
# разрешения владельца (одновременно с проверкой RS485-топологии).

data_source:
  # demo | mock | modbus
  mode: "demo"

  # Используется только при mode=modbus и явном включении.
  modbus:
    host: "192.0.2.10"        # документационный адрес, НЕ физический шлюз
    port: 502
    unit_id: 1
    timeout_seconds: 2.0
    poll_interval_seconds: 5.0
    register_profile: "stage7"

  # Демо-источник работает локально, без TCP.
  demo:
    sqlite_path: "/tmp/sunlink-stage12-demo.db"

# HTTP API (только для чтения; write-эндпоинтов нет)
server:
  host: "127.0.0.1"
  port: 8801

# Никаких write-настроек, TOU, паролей и уведомлений:
# read-only архитектура не допускает команд управления инвертором.
